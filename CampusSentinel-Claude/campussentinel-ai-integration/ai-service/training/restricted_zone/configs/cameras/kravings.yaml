# Restricted zones for simulated camera 'kravings' (Kravings).
# FICTIONAL demo zones and schedules: not real campus rules. Same format as ../zones.sample.yaml.
# Redraw polygons for your own clip with: python -m training.restricted_zone.pick_zone --source <video>
# (detector.weights is ignored by the AI service, which uses the model chosen in inference/model_manager.py)
campus_timezone: Asia/Kolkata
camera_id: kravings
detector: {weights: models/person/yolo26n.pt, confidence: 0.4, iou: 0.5, image_size: 640,
  device: auto, half: true}
tracker: {config: training/restricted_zone/trackers/bytetrack_campus.yaml}
incidents: {min_dwell_seconds: 1.0, cooldown_seconds: 300, save_evidence_frames: true}
zones:
- id: kravings-kitchen
  name: Kravings kitchen access (fictional)
  status: restricted
  polygon:
  - [0.6, 0.5]
  - [1.0, 0.5]
  - [1.0, 1.0]
  - [0.6, 1.0]
  schedule:
    default: allowed
    restricted:
    - days: [mon, tue, wed, thu, fri, sat, sun]
      start: '22:00'
      end: 06:00
